/* ---------- Visninger ---------- */
function inView(c, view){
  const t = trackOf(c);
  switch(view){
    case "open":     return !isClosed(c);
    case "deadline": return caseDeadlines(c).some(d => d.days <= 7);
    case "followup": { const d = daysUntil(c.Paamindelse); return !isClosed(c) && d !== null && d <= 0; }
    case "police":   return t === "police" || (t === "incident" && ["112-hændelse","Politisag"].includes(c.Sagstype));
    case "court":    return ["court","decided"].includes(t) || (c.Sagstype === "Retssag" && t !== "closed");
    case "access":   return c.Sagstype === "Aktindsigt";
    case "closed":   return isClosed(c);
    default:         return true;
  }
}
const viewTitles = {dashboard:"Søgeresultater",calendar:"Søgeresultater",all:"Alle sager",open:"Åbne sager",deadline:"Frister inden for 7 dage – inkl. overskredne",followup:"Opfølgning i dag eller overskredet",police:"Hændelser og sager hos politiet",court:"Sager hos anklagemyndigheden og i retten",access:"Aktindsigter",closed:"Afsluttede sager",trash:"Papirkurv"};
function setView(v){
  currentView = v; selected.clear();
  document.querySelectorAll(".nav button").forEach(x => x.classList.toggle("active", x.dataset.view === v));
  render();
}
function filteredCases(){
  const q = $("search").value.trim().toLowerCase();
  const data = db.sager.filter(c => {
    if(currentView === "trash" ? c.Slettet !== "Ja" : c.Slettet === "Ja") return false;
    if(!inView(c, currentView)) return false;
    if(q){
      const blob = [...Object.values(c), ...["journalnumre","forhold","artikler","dokumenter","personer","retsmoeder","log","faseforloeb"].flatMap(s => rows(s,c.SagsID).flatMap(Object.values))].join(" ").toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
  const sort = $("sortBy").value;
  const dl = c => caseDeadlines(c)[0]?.date || "9999";
  const ct = c => nextCourt(c)?.Dato || "9999";
  data.sort((a,b) =>
    sort === "deadline" ? dl(a).localeCompare(dl(b)) :
    sort === "court"    ? String(ct(a)).localeCompare(String(ct(b))) :
    sort === "incident" ? String(b.Haendelsesdato ?? "").localeCompare(String(a.Haendelsesdato ?? "")) :
    sort === "stage"    ? lists.stages.indexOf(a.Fase) - lists.stages.indexOf(b.Fase) :
    sort === "title"    ? String(a.Titel ?? "").localeCompare(String(b.Titel ?? ""), "da") :
                          String(b.Opdateret ?? "").localeCompare(String(a.Opdateret ?? "")));
  return data;
}
function render(){
  renderNav(); renderKpis();
  const q = $("search").value.trim();
  const overview = ["dashboard","calendar"].includes(currentView) && !q;
  $("overview").style.display = overview ? "" : "none";
  $("listWrap").style.display = overview ? "none" : "";
  $("downloadBtn").disabled = !(workbookLoaded || db.sager.length);
  if(overview){
    $("overview").innerHTML = currentView === "dashboard" ? dashboardHtml() : calendarHtml();
    visibleIds = [];
    return;
  }
  const data = filteredCases(); visibleIds = data.map(c => c.SagsID);
  $("viewTitle").textContent = (q ? `Søgning: “${q}” · ` : "") + (q && ["dashboard","calendar"].includes(currentView) ? "alle sager" : viewTitles[currentView]) + ` (${data.length})`;
  $("selectedText").textContent = `${selected.size} markerede`;
  $("deleteSelectedBtn").textContent = currentView === "trash" ? "Slet permanent" : "Flyt til papirkurv";
  $("restoreSelectedBtn").style.display = currentView === "trash" ? "inline-block" : "none";
  $("caseList").innerHTML = data.length ? data.map(card).join("") : '<div class="empty">Ingen sager matcher.</div>';
}
function renderNav(){
  const act = activeCases();
  const cnt = v => act.filter(c => inView(c, v)).length;
  $("navAll").textContent = act.length; $("navList").textContent = act.length;
  $("navCal").textContent = agendaItems(14).filter(e => e.days >= 0).length;
  const fu = cnt("followup"); $("navFollow").textContent = fu; $("navFollow").classList.toggle("alert", fu > 0);
  $("navOpen").textContent = cnt("open");
  const late = act.filter(c => caseDeadlines(c).some(d => d.days < 0)).length;
  $("navLate").textContent = cnt("deadline"); $("navLate").classList.toggle("alert", late > 0);
  $("navPolice").textContent = cnt("police"); $("navCourt").textContent = cnt("court");
  $("navAccess").textContent = cnt("access"); $("navClosed").textContent = cnt("closed");
  $("navTrash").textContent = db.sager.filter(s => s.Slettet === "Ja").length;
}
function renderKpis(){
  const act = activeCases();
  const late = act.filter(c => caseDeadlines(c).some(d => d.days < 0)).length;
  const soon = act.filter(c => caseDeadlines(c).some(d => d.days >= 0 && d.days <= 7)).length;
  const meetings = agendaItems(14).filter(e => e.isMeeting).length;
  $("kpis").innerHTML = [
    ["Åbne sager", act.filter(c => !isClosed(c)).length, "open"],
    ["Hos politiet", act.filter(c => !isClosed(c) && inView(c,"police")).length, "police"],
    ["I retten", act.filter(c => !isClosed(c) && inView(c,"court")).length, "court"],
    ["Retsmøder 14 dage", meetings, "calendar"],
    ["Frist ≤ 7 dage", soon, "deadline"],
    ["Overskredet", late, "deadline", late > 0]
  ].map(([a,b,v,alert]) => `<div class="kpi ${alert?"alert":""}" onclick="setView('${v}')"><strong>${b}</strong><span>${a}</span></div>`).join("");
}
function card(c){
  const checked = selected.has(c.SagsID) ? "checked" : "";
  const parts = [["personer","person","personer"],["retsmoeder","retsmøde","retsmøder"],["dokumenter","dokument","dokumenter"],["artikler","artikel","artikler"]]
    .map(([k,one,many]) => { const n = rows(k,c.SagsID).length; return n ? `${n} ${n===1?one:many}` : ""; }).filter(Boolean).join(" · ");
  const si = lists.stages.indexOf(c.Fase);
  const nr = nextCourt(c);
  const deleted = c.Slettet === "Ja";
  const dls = caseDeadlines(c).slice(0,2).map(dlBadge).join("");
  const ak = caseDocWithLink(c, "Anklageskrift", c.TiltaleDato);
  const meta = [c.Sagstype, c.Sted, c.Haendelsesdato ? fmtDate(c.Haendelsesdato) + (c.Gerningstid ? " kl. " + c.Gerningstid : "") : "", c.PolitietsJournalnummer ? "J.nr. " + c.PolitietsJournalnummer : "", c.RettensSagsnummer ? "Ret: " + c.RettensSagsnummer : ""].filter(Boolean).map(esc).join(" · ");
  return `<article class="casecard tr-${trackOf(c)} ${c.SagsID===currentId?"active":""}">
    <div class="casehead">
      <input type="checkbox" ${checked} onchange="toggleSel(${jq(c.SagsID)},this.checked)">
      <div class="cbody"><div class="title" onclick="openCase(${jq(c.SagsID)})">${esc(c.Titel||"Uden titel")}</div><div class="meta">${meta}${parts?`<br>${parts}`:""}</div></div>
      <span class="cstatus">${deleted ? "Papirkurv" : esc(c.Status||"")}${c.Prioritet==="Høj"?' · <span style="color:var(--red)">Høj</span>':""}</span>
    </div>
    <div class="phase"><div class="progress">${lists.stages.map((s,i) => `<i class="${i<=si?"done":""}" title="${esc(s)}"></i>`).join("")}</div><span>${esc(c.Fase||"Ukendt fase")}</span></div>
    <div class="cfoot">
      <div class="badges">${isClosed(c) ? '<span class="badge green">Afsluttet</span>' : dls}${nr?`<span class="badge violet">${esc(nr.Type||"Retsmøde")} ${esc(fmtDate(nr.Dato))}${nr.Starttid?" kl. "+esc(nr.Starttid):""}</span>`:""}${["Ja","Surrogat"].includes(c.Varetaegt)&&!isClosed(c)?`<span class="badge red">Varetægt</span>`:""}${followBadge(c)}</div>
      <div class="actions">${ak ? `<a class="cardlink" href="${esc(ak.URL)}" target="_blank" rel="noopener">Anklageskrift ↗</a>` : ""}${!deleted && c.Fase !== "Afsluttet" ? `<button class="ghost small" onclick="advancePhase(${jq(c.SagsID)})">Næste fase →</button>` : ""}<button class="small" onclick="openCase(${jq(c.SagsID)})">Åbn</button></div>
    </div>
  </article>`;
}
/* Dokument af en bestemt type med link – helst det med samme dato som fx tiltalen */
function caseDocWithLink(c, type, date){
  const d = rows("dokumenter", c.SagsID).filter(x => x.Type === type && safeUrl(x.URL));
  return d.find(x => String(x.Dato ?? "").slice(0,10) === String(date ?? "").slice(0,10)) || d[0];
}
function mini(c){
  const dl = caseDeadlines(c)[0], nr = nextCourt(c);
  const ak = caseDocWithLink(c, "Anklageskrift", c.TiltaleDato);
  return `<div class="mini tr-${trackOf(c)} ${c.SagsID===currentId?"active":""}" onclick="openCase(${jq(c.SagsID)})">
    <div class="t">${esc(c.Titel||"Uden titel")}</div>
    <div class="meta">${[c.Fase, c.Sted, (n => n ? `${n} ${n === 1 ? "artikel" : "artikler"}` : "")(rows("artikler", c.SagsID).length)].filter(Boolean).map(esc).join(" · ")}</div>
    ${(dl||nr||c.Varetaegt==="Ja"||followBadge(c)) ? `<div class="badges">${dl?dlBadge(dl):""}${nr?`<span class="badge violet">Ret ${esc(fmtDate(nr.Dato))}</span>`:""}${["Ja","Surrogat"].includes(c.Varetaegt)&&!isClosed(c)?'<span class="badge red">Varetægt</span>':""}${followBadge(c)}</div>` : ""}
    ${ak ? `<a class="minilink" href="${esc(ak.URL)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Anklageskrift ↗</a>` : ""}
    ${!isClosed(c) ? `<button class="ghost small adv" onclick="event.stopPropagation();advancePhase(${jq(c.SagsID)})">Næste fase →</button>` : ""}
  </div>`;
}
function relDay(date){ const d = daysUntil(date); return d === 0 ? "I dag" : d === 1 ? "I morgen" : cap(fmtDate(date)); }
function agendaHtml(items){
  if(!items.length) return '<div class="empty">Intet i perioden.</div>';
  let html = "", last = "";
  items.forEach(e => {
    const grp = e.days < 0 ? "Overskredet" : relDay(e.date);
    if(grp !== last){ html += `<div class="aghead ${e.days<0?"late":""}">${esc(grp)}</div>`; last = grp; }
    const badge = e.days < 0 ? `<span class="badge red">${-e.days} d. over</span>` : e.time ? `<span class="badge">kl. ${esc(e.time)}</span>` : "";
    const meta = [e.meta, e.days<0?fmtDate(e.date):""].filter(Boolean).join(" · ");
    html += `<div class="agrow ${e.days<0?"late":""}" onclick="openCase(${jq(e.SagsID)})">${tag(e.kind)}<div><span class="agt">${esc(e.title)}</span> <span class="agc">· ${esc(e.case.Titel||"Uden titel")}</span>${meta?`<div class="meta">${esc(meta)}</div>`:""}</div>${badge}</div>`;
  });
  return html;
}
function gapsHtml(){
  const gl = activeCases().map(c => ({c, g:gaps(c)})).filter(x => x.g.length)
    .sort((a,b) => (a.c.Prioritet==="Høj"?0:1) - (b.c.Prioritet==="Høj"?0:1) || b.g.length - a.g.length);
  if(!gl.length) return '<div class="empty">Ingen huller fundet.</div>';
  return gl.slice(0,15).map(({c,g}) => `<div class="gap" onclick="openCase(${jq(c.SagsID)})"><div><strong>${esc(c.Titel||"Uden titel")}</strong><div class="meta">${g.map(esc).join(" · ")}</div></div><span class="badge">${esc(c.Fase||"")}</span></div>`).join("")
    + (gl.length > 15 ? `<div class="notice" style="margin-top:8px">+ ${gl.length-15} sager mere</div>` : "");
}
function boardHtml(){
  const act = activeCases();
  const urg = c => caseDeadlines(c)[0]?.days ?? 9999;
  return `<div class="board">${tracks.map(t => {
    const all = act.filter(c => trackOf(c) === t.key);
    const cs = t.key === "closed"
      ? all.slice().sort((a,b) => String(b.Opdateret ?? "").localeCompare(String(a.Opdateret ?? ""))).slice(0,6)
      : all.slice().sort((a,b) => urg(a) - urg(b) || String(b.Opdateret ?? "").localeCompare(String(a.Opdateret ?? "")));
    return `<div class="col tr-${t.key}"><h3><i class="dot"></i>${esc(t.label)}<span class="n">${all.length}</span></h3>${cs.map(mini).join("") || '<div class="notice" style="margin:0 6px">Ingen sager</div>'}${t.key==="closed" && all.length > cs.length ? `<button class="ghost small colmore" onclick="setView('closed')">Se alle ${all.length} →</button>` : ""}</div>`;
  }).join("")}</div>`;
}

function bindDetailInputs(){
  const pf = $("ph_f");
  if(pf) pf.addEventListener("change", () => { if(!(editing && editing.sheet === "faseforloeb")) $("ph_d").value = phaseDefaultDate(current(), pf.value); });
  document.querySelectorAll("#detail [id^='d_']").forEach(el => {
    const field = el.id.slice(2);
    if(field === "Fase"){
      el.addEventListener("change", () => {
        const c = current(); const fase = el.value;
        const d = askDate(`Sæt fasen til “${fase}”.\nHvornår skete det?`, phaseDefaultDate(c, fase));
        if(!d || !setPhase(currentId, fase, d, "")) el.value = c.Fase;
      });
      return;
    }
    el.addEventListener("input", () => {
      const c = current(); if(!c) return;
      c[field] = el.value; c.Opdateret = nowIso(); if(dbx.account) c.OpdateretAf = dbx.account; setDirty(true);
      if(field === "Titel") $("caseTitle").textContent = el.value || "Uden titel";
      render();
    });
    el.addEventListener("change", () => {
      const c = current(); if(!c) return;
      if(FIELD_PHASE[field] && syncPhaseFromField(c, field)){ render(); renderDetail(); return; }
      const tl = $("tlBody"); if(tl) tl.innerHTML = timelineHtml(c);
    });
  });
  document.querySelectorAll("#detail details").forEach(d => d.addEventListener("toggle", () => { d.open ? openSections.add(d.dataset.sec) : openSections.delete(d.dataset.sec); saveOpenSections(); }));
}
function timelineHtml(c){
  const ev = caseEvents(c);
  if(!ev.length) return '<div class="empty">Ingen daterede begivenheder endnu. Udfyld datoer, faseskift, retsmøder eller log – så bygges tidslinjen automatisk.</div>';
  const t = today(); let html = '<div class="timeline">', nowDone = false;
  ev.forEach(e => {
    if(!nowDone && e.date > t){ html += `<div class="nowline">I dag · ${esc(fmtDate(t))}</div>`; nowDone = true; }
    html += `<div class="tl k-${e.kind} ${e.date>t?"future":""}"><div class="d">${esc(fmtDate(e.date))}${e.time?" · kl. "+esc(e.time):""}</div><strong>${esc(e.title)}</strong>${e.meta?`<div class="meta">${esc(trunc(e.meta,180))}</div>`:""}${e.link?`<a class="tllink" href="${esc(e.link.url)}" target="_blank" rel="noopener">${esc(e.link.label)} ↗</a>`:""}</div>`;
  });
  if(!nowDone) html += `<div class="nowline">I dag · ${esc(fmtDate(t))}</div>`;
  return html + "</div>";
}

function templates(){

  const sag = (c.Titel || "[sag]") + (ref ? ` (${ref})` : "");
  tplTexts = [
    {title:"Aktindsigtsanmodning", text:
`Kære ${c.Myndighed||"[myndighed]"}

Jeg søger hermed aktindsigt/indsigt i materiale vedrørende ${sag}.

Anmodningen omfatter:
${c.Anmodning||"[beskriv dokumenter, bilag, retsbog, anklageskrift mv.]"}

Hvis dele undtages, beder jeg om konkret begrundelse og meroffentlighedsvurdering.

Venlig hilsen`},
    {title:"Rykker – aktindsigt", text:
`Kære ${c.Myndighed||"[myndighed]"}

Den ${c.Sendt?fmtDate(c.Sendt):"[dato]"} anmodede jeg om aktindsigt i materiale vedrørende ${sag}.

Jeg har endnu ikke modtaget en afgørelse. Jeg beder om en status og en forventet svardato, jf. offentlighedslovens § 36.

Venlig hilsen`},
    {title:"Til politiet – status på sagen", text:
`Kære ${c.Politikreds||"[politikreds]"}

Jeg følger hændelsen ${c.Haendelsesdato?"den "+fmtDate(c.Haendelsesdato)+" ":""}${c.Sted?"i/ved "+c.Sted+" ":""}– ${sag}.

Kan I oplyse:
– om der er anholdt eller sigtet nogen, og i givet fald for hvad
– om der er eller skal være grundlovsforhør
– sagens journalnummer, så jeg kan følge den videre

Venlig hilsen`},
    {title:"Til anklagemyndigheden – tiltale og berammelse", text:
`Kære ${c.Anklagemyndighed||"[anklagemyndighed]"}

Jeg følger sagen ${sag}.

Vil I oplyse, om der er rejst tiltale, og om/hvornår sagen er berammet – herunder ret, retsdage og retssal?

Venlig hilsen`},
    {title:"Til retten – anklageskrift / dom", text:
`Kære ${c.Ret||"[retten]"}

Jeg er journalist og følger sagen ${sag}${c.DomDato?", hvor der blev afsagt dom den "+fmtDate(c.DomDato):""}.

Jeg beder om at få tilsendt ${c.DomDato?"dommen":"anklageskriftet og en oversigt over berammede retsmøder"} i sagen.

Venlig hilsen`}
  ];

}
function copyTpl(i){
  const txt = tplTexts[i]?.text || "";
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => flash("Tekst kopieret"), () => alert("Kunne ikke kopiere – markér teksten manuelt."));
  else alert("Kopiering understøttes ikke her – markér teksten manuelt.");
}

function init(){
  toggleDetail(detailOpen);
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => setView(b.dataset.view));
  $("saveBtn").onclick = () => saveWorkbook(); $("reloadBtn").onclick = reloadFromDropbox;
  $("pickBtn").onclick = () => storage === "local" ? openLocal() : showPicker(dirOf(dbx.path));
  $("switchBtn").onclick = chooseStorage; $("localFileInput").onchange = importLocal; $("downloadBtn").onclick = downloadWorkbook; $("logoutBtn").onclick = dbxLogout;
  $("autoSave").checked = autoSave;
  $("autoSave").onchange = e => { autoSave = e.target.checked; localStorage.setItem(LSK.auto, autoSave); if(autoSave && dirty) saveWorkbook({silent:true}); };
  $("bannerClose").onclick = hideBanner;
  $("newBtn").onclick = newCase;
  $("toggleDetailBtn").addEventListener("click", () => toggleDetail());
  $("search").oninput = render; $("sortBy").oninput = render;
  $("selectVisibleBtn").onclick = () => { visibleIds.forEach(id => selected.add(id)); render(); };
  $("clearSelectBtn").onclick = () => { selected.clear(); render(); };
  $("deleteSelectedBtn").onclick = deleteSelected;
  $("restoreSelectedBtn").onclick = restoreSelected;
  document.addEventListener("keydown", e => { if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); saveWorkbook(); } });
  window.addEventListener("beforeunload", e => { if(dirty){ flushBackup(); e.preventDefault(); e.returnValue = ""; } });
  document.addEventListener("visibilitychange", () => { if(!document.hidden) checkRemote(); });
  setInterval(checkRemote, 60000);
  // Tjek dato-skift ved midnat, så frister og "i dag" passer
  let lastDay = today();
  setInterval(() => { if(today() !== lastDay){ lastDay = today(); render(); renderDetail(); } }, 60000);
  render(); renderDetail();
  boot();
}
init();
</script>
